name: 🐛 Bug report
description: Something behaves differently than you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. You don't need to fill in every box —
        even a half-complete report is more useful than a missing one.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
      placeholder: I scheduled a Short for 9am and two got published.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      description: Rough steps are fine. "I'm not sure, it just happens sometimes" is also a valid answer.
      placeholder: |
        1. Go to …
        2. Click …
        3. Wait for the next cycle

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Dashboard / UI
        - Content generation (text, cards, carousels)
        - Shorts rendering (video, music, voiceover)
        - Publishing / scheduling
        - Comments & DMs
        - Analytics / digest email
        - Setup, install or database
        - Not sure

  - type: textarea
    id: logs
    attributes:
      label: Any logs or errors?
      description: Paste anything relevant. It will be formatted automatically.
      render: shell
  - type: markdown
    attributes:
      value: |
        ⚠️ **Please double-check that no API keys, tokens or account IDs are in what you pasted.**

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 20, Postgres 16, running locally / Docker / Railway
